<meta name="description" content="Jeu de soirée entre amis : qui est le plus susceptible de… et qui a déjà…">
<title>Qui de nous ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout : une seule colonne façon jeu de cartes, une "carte" plein écran par question. Univers nocturne assumé (thème unique). */
:root{
  --night:#1a1027;      /* fond */
  --night-2:#251838;    /* surfaces */
  --line:#3a2a52;
  --ink:#f6eefc;        /* texte */
  --muted:#b6a5cc;
  --sus:#ff6b4a;        /* mode "plus susceptible" : corail */
  --sus-ink:#2a0d05;
  --deja:#ffc93c;       /* mode "qui a déjà" : jaune néon chaud */
  --deja-ink:#2b1f00;
  --av:#5fe0b5;         /* mode "action ou vérité" : menthe */
  --av-ink:#05271c;
  --accent:var(--sus);
  --accent-ink:var(--sus-ink);
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
[hidden]{display:none!important}
body{
  background:var(--night);
  background-image:radial-gradient(1200px 600px at 110% -10%, #3b1d4a 0%, transparent 60%),radial-gradient(900px 500px at -20% 110%, #2a1640 0%, transparent 60%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--deja);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.02}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- Accueil ---------- */
.brand{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.brand h1{font-size:clamp(46px,13vw,76px);font-weight:800;letter-spacing:-.03em}
.brand h1 span{color:var(--sus)}
.brand h1 em{font-style:normal;color:var(--deja)}
.brand p{margin:0;color:var(--muted);max-width:40ch}

.panel{background:var(--night-2);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit}
.btn{border-radius:12px;padding:12px 16px;font-weight:700;background:var(--ink);color:var(--night)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-radius:999px;background:var(--night);border:1px solid var(--line);font-weight:500}
.chip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:16px;line-height:1}
.chip button:hover{background:var(--line);color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:0}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.mode.av{background:var(--av);color:var(--av-ink)}
@media (max-width:440px){.modes{grid-template-columns:1fr}}
.mode{border-radius:20px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:170px;justify-content:space-between;transition:transform .15s ease}
.mode:hover:not(:disabled){transform:translateY(-3px) rotate(-.6deg)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.mode.sus{background:var(--sus);color:var(--sus-ink)}
.mode.deja{background:var(--deja);color:var(--deja-ink)}
.mode h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.mode p{margin:0;font-size:14px;font-weight:500;opacity:.85}
.mode .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.75}

.opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:inline-flex;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:7px 12px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.opt{display:flex;flex-direction:column;gap:6px}

details.custom summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.custom summary::-webkit-details-marker{display:none}
details.custom summary::after{content:"+";font-size:22px;color:var(--muted)}
details.custom[open] summary::after{content:"–"}
details.custom .inner{display:flex;flex-direction:column;gap:12px;margin-top:12px}
textarea{width:100%;min-height:96px;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font:inherit;font-size:14px;resize:vertical}

/* ---------- Partie ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.progress{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s ease}

.card{
  background:var(--accent);color:var(--accent-ink);border-radius:28px;padding:28px 24px 30px;
  display:flex;flex-direction:column;gap:14px;min-height:230px;justify-content:center;
  box-shadow:0 18px 50px -20px var(--accent);
  animation:deal .35s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes deal{from{transform:translateY(24px) rotate(2deg) scale(.96);opacity:0}to{transform:none;opacity:1}}
.card .lead{font-family:var(--display);font-weight:700;font-size:18px;opacity:.75}
.card .q{font-family:var(--display);font-weight:800;font-size:clamp(28px,7.5vw,40px);letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.card .spicy{align-self:flex-start;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;border:1.5px solid currentColor;border-radius:99px;padding:3px 9px}

.instr{margin:0;color:var(--muted);font-size:15px;text-align:center}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pbtn{background:var(--night-2);border:2px solid var(--line);border-radius:16px;padding:14px 12px;font-weight:700;font-size:17px;text-align:center;transition:transform .1s ease, background .15s, border-color .15s;overflow-wrap:anywhere}
.pbtn:hover{border-color:var(--accent)}
.pbtn:active{transform:scale(.96)}
.pbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pbtn small{display:block;font-weight:500;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:140px}
.btn.accent{background:var(--accent);color:var(--accent-ink)}

.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding:6px 0}
.result .big{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,52px);color:var(--accent);letter-spacing:-.02em;line-height:1.05;text-wrap:balance}

.countdown{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb, var(--night) 88%, transparent);z-index:20}
.countdown span{font-family:var(--display);font-weight:800;font-size:min(48vw,260px);color:var(--accent);animation:pop .8s ease forwards}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:.9}}

/* ---------- Fin ---------- */
.podium{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.row .rk{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.row .sc{font-variant-numeric:tabular-nums;font-weight:700}
.row.first{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row.first .rk{color:inherit}
.crown{font-size:14px;font-weight:500;color:var(--muted);margin:0}

/* ---------- En ligne ---------- */
.field{width:100%;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit}
.online-cta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg,var(--sus),var(--deja));color:var(--sus-ink);border-radius:20px;padding:18px}
.online-cta > div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.online-cta h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.online-cta p{margin:0;font-size:14px;font-weight:500}
.online-cta .btn{background:var(--night);color:var(--ink)}
.code{font-family:var(--display);font-weight:800;font-size:clamp(56px,18vw,96px);letter-spacing:.12em;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.err{color:var(--sus);font-weight:700;margin:0}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;overflow-wrap:anywhere}
.tagme{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.btn.small{padding:6px 10px;font-size:13px}
.btn.big{padding:16px;font-size:18px;width:100%}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yesno .pbtn{font-size:20px;padding:22px 12px}
.tally{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-weight:700}
.trow .who{min-width:0;overflow-wrap:anywhere}
.trow .tb{grid-column:1/-1;height:16px;border-radius:99px;background:var(--night);border:1px solid var(--line);overflow:hidden}
.trow .tb i{display:block;height:100%;border-radius:99px;background:var(--muted);transition:width .5s ease}
.trow .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.trow.win .who,.trow.win .n{color:var(--accent)}
.trow.win .tb i{background:var(--accent)}
.voted{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.voted span{font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.voted span.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button:disabled{cursor:default}

/* ---------- Grand écran (PC) : la page s'étale en largeur ---------- */
@media (min-width:900px){
  body{padding-block:32px 56px}
  .wrap{max-width:1180px}
  .brand h1{font-size:clamp(76px,7.5vw,108px)}
  .brand p{font-size:18px;max-width:52ch}

  /* Accueil : joueurs et réglages côte à côte, les 3 jeux sur une ligne */
  #app[data-screen="home"]{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 28px;align-items:start}
  #app[data-screen="home"] > .brand,
  #app[data-screen="home"] > .online-cta,
  #app[data-screen="home"] > .label,
  #app[data-screen="home"] > .modes{grid-column:1/-1}
  #app[data-screen="home"] .online-cta{padding:24px 28px}
  #app[data-screen="home"] .online-cta h2{font-size:30px}
  #app[data-screen="home"] .modes{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  #app[data-screen="home"] .mode{min-height:240px;padding:24px}
  #app[data-screen="home"] .mode h2{font-size:32px}
  #app[data-screen="home"] .mode p{font-size:15px}

  /* En jeu : la carte à gauche (elle reste visible), les boutons et résultats à droite */
  #app:has(> .card){display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px 40px;align-items:start}
  #app:has(> .card) > *{grid-column:2}
  #app:has(> .card) > .topbar,
  #app:has(> .card) > .bar{grid-column:1/-1}
  #app:has(> .card) > .card{grid-column:1;grid-row:3 / span 30;position:sticky;top:28px;min-height:440px;padding:40px 36px}
  #app:has(> .card) > .instr{text-align:left}
  #app:has(> .card) .result{align-items:flex-start;text-align:left}
  #app:has(> .card) .voted{justify-content:flex-start}
  .card .lead{font-size:22px}
  .card .q{font-size:clamp(38px,3.8vw,58px)}
  .players{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .pbtn{padding:18px 14px}

  /* Salle d'attente en ligne : code et joueurs côte à côte */
  #app[data-screen="online"]:not(:has(> .card)){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 28px;align-items:stretch}
  #app[data-screen="online"]:not(:has(> .card)) > *{grid-column:1/-1}
  #app[data-screen="online"]:not(:has(> .card)) > section.panel:nth-of-type(1){grid-column:1;justify-content:center}
  #app[data-screen="online"]:not(:has(> .card)) > section.panel:nth-of-type(2){grid-column:2}

  /* Écrans de classement et d'entrée en ligne : colonne centrée, plus large qu'avant */
  #app[data-screen="end"],
  #app[data-screen="online"]:has(> .podium):not(:has(> .card)),
  #app[data-screen="online-entry"]{display:flex;max-width:820px}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

// Les questions d'Action ou vérité pas encore posées passent d'abord.
function poolAV(type, level){
  const list = AV[level][type];
  const seen = store.get("seen_av", []);
  const rank = new Map(seen.map((t,i) => [t,i]));
  return shuffle(list.filter(t => !rank.has(t))).concat(list.filter(t => rank.has(t)).sort((a,b) => rank.get(a)-rank.get(b)));
}
function markSeenAV(t){
  const s = store.get("seen_av", []).filter(x => x!==t); s.push(t);
  store.set("seen_av", s.slice(-3000));
}
const fillPlayer = (t, others) => t.replace(/\{joueur\}/g, () => others.length ? others[Math.floor(Math.random()*others.length)] : "quelqu'un");
function drawAV(lists, idx, type){
  const l = lists[type] || [];
  const t = l.length ? l[(idx[type]||0) % l.length] : "…";
  idx[type] = (idx[type]||0) + 1;
  markSeenAV(t);
  return t;
}
const AV_LEVEL_TAG = { mod:"Modéré", hard:"Hard" };
function avCardHtml(card, who, level){
  return `<article class="card" aria-live="polite">
      ${AV_LEVEL_TAG[level] ? `<span class="spicy">${AV_LEVEL_TAG[level]}</span>` : ""}
      <div class="lead">${esc(who)} · ${card.type==="v" ? "Vérité" : "Action"}</div>
      <div class="q">${esc(card.t)}</div>
    </article>`;
}
function avTurnHtml(who, isMe){
  return `<article class="card"><div class="lead">Au tour de</div><div class="q">${esc(who)}${isMe ? " (toi)" : ""}</div></article>`;
}
function avScoresHtml(entries){
  return `<div class="voted">${entries.map(([name,s]) => `<span>${esc(name)} · ${s} pt${s>1 ? "s" : ""}</span>`).join("")}</div>`;
}

function markSeen(mode, deck){
  const used = new Set(deck.filter(d => !d.own).map(d => d.t));
  const seen = store.get("seen_"+mode, []).filter(t => !used.has(t)).concat([...used]);
  store.set("seen_"+mode, seen.slice(-3000));
}

/* ================= Partie ================= */
function startGame(mode){
  if(mode==="av"){ startAV(); return; }
  const own = S.custom[mode].split("\n").map(s=>s.trim().replace(/^(qui est le plus susceptible de|qui a déjà)\s*/i,"").replace(/\s*\?$/,"")).filter(Boolean)
    .map(t=>({t, own:true}));
  const deck = shuffle(own.concat(poolFor(mode, S.level)).slice(0, Math.max(S.rounds, own.length))).slice(0, S.rounds);
  markSeen(mode, deck);
  S.game = { mode, deck, i:0, scores:Object.fromEntries(S.players.map(p=>[p,0])), picked:new Set(), counts:{}, revealed:null };
  setAccent(mode);
  S.screen="play"; render();
}
function setAccent(mode){
  document.documentElement.style.setProperty("--accent", MODES[mode].accent);
  document.documentElement.style.setProperty("--accent-ink", MODES[mode].ink);
}

function renderPlay(){
  if(S.game.mode==="av") return renderAVLocal();
  const g = S.game, M = MODES[g.mode], card = g.deck[g.i];
  const pct = (g.i/g.deck.length)*100;
  const revealed = g.revealed;
  app.innerHTML = `
    <div class="topbar">
      <button class="btn ghost" id="quit">Quitter</button>
      <span class="progress">Question ${g.i+1} / ${g.deck.length}</span>
    </div>
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>

    <article class="card" aria-live="polite">
      ${card.lvl ? `<span class="spicy">${card.lvl==="hard" ? "Hard" : "Modéré"}</span>` : card.own ? `<span class="spicy">Question maison</span>` : ""}
      <div class="lead">${M.lead}</div>
      <div class="q">${esc(card.t)} ?</div>
    </article>

    ${revealed ? renderReveal(revealed) : `
      <p class="instr">${M.instr}</p>
      ${g.mode==="sus" ? `<div class="actions"><button class="btn ghost" id="count">Lancer le 3, 2, 1</button></div>` : ""}
      <div class="players">
        ${S.players.map(p=>{
          const c = g.counts[p] || 0;
          const on = g.mode==="sus" ? c>0 : g.picked.has(p);
          const sub = g.mode==="sus" && c>0 ? `${c} vote${c>1?"s":""}` : `${g.scores[p]} pt${g.scores[p]>1?"s":""}`;
          return `<button class="pbtn" data-p="${esc(p)}" aria-pressed="${on}">${esc(p)}<small>${sub}</small></button>`;
        }).join("")}
      </div>
      <div class="actions">
        <button class="btn ghost" id="skip">Passer</button>
        ${g.mode==="deja" ? `<button class="btn accent" id="validate">${g.picked.size ? `Valider (${g.picked.size})` : "Personne"}</button>` : ""}
        ${g.mode==="sus" && totalVotes(g) ? `<button class="btn ghost" id="resetVotes">Remettre à zéro</button>` : ""}
        ${g.mode==="sus" ? `<button class="btn accent" id="validate" ${totalVotes(g) ? "" : "disabled"}>Valider (${totalVotes(g)} vote${totalVotes(g)>1?"s":""})</button>` : ""}
      </div>
    `}
  `;
  document.getElementById("quit").onclick = () => { S.screen="home"; render(); };
  if(revealed){ document.getElementById("next").onclick = next; return; }

  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
    const p = b.dataset.p;
    if(g.mode==="sus"){ g.counts[p] = (g.counts[p]||0) + 1; renderPlay(); }
    else { g.picked.has(p) ? g.picked.delete(p) : g.picked.add(p); renderPlay(); }
  });
  document.getElementById("skip").onclick = next;
  const rv = document.getElementById("resetVotes");
  if(rv) rv.onclick = () => { g.counts = {}; renderPlay(); };
  const v = document.getElementById("validate");
  if(v) v.onclick = () => {
    if(g.mode==="sus"){
      const max = Math.max(0, ...Object.values(g.counts));
      const who = S.players.filter(p => max>0 && g.counts[p]===max);
      who.forEach(p => g.scores[p]++);
      g.revealed = { who, tally: Object.assign({}, g.counts) };
    } else {
      const who=[...g.picked]; who.forEach(p=>g.scores[p]++); g.revealed={who};
    }
    renderPlay();
  };
  const c = document.getElementById("count");
  if(c) c.onclick = countdown;
}

function renderReveal(r){
  const g = S.game;
  let big, sub;
  let bars = "";
  if(g.mode==="sus"){
    big = r.who.map(esc).join(", ");
    sub = r.who.length>1 ? "Égalité ! +1 point chacun." : "a reçu le plus de votes. +1 point.";
    bars = tallyHtml(r.tally || {}, r.who, p => p);
  }
  else if(!r.who.length){ big = "Personne"; sub = "Des anges, ou des menteurs."; }
  else if(r.who.length===S.players.length){ big = "Tout le monde"; sub = "Personne n'est innocent ici. +1 pour chacun."; }
  else { big = r.who.map(esc).join(", "); sub = r.who.length>1 ? "l'ont déjà fait. +1 point chacun." : "l'a déjà fait. +1 point."; }
  const last = g.i === g.deck.length-1;
  return `
    <div class="result"><div class="big">${big}</div><p class="instr">${sub}</p></div>
    ${bars}
    <div class="actions"><button class="btn accent" id="next">${last ? "Voir le classement" : "Question suivante"}</button></div>`;
}

const totalVotes = g => Object.values(g.counts || {}).reduce((a,b) => a+b, 0);
// Une barre par personne ayant reçu au moins un vote, de la plus votée à la moins votée.
function tallyHtml(tally, winners, label){
  const rows = Object.entries(tally).filter(([,n]) => n>0).sort((a,b) => b[1]-a[1]);
  if(!rows.length) return `<div class="panel tally"><p class="hint">Personne n'a voté.</p></div>`;
  const max = rows[0][1];
  return `<div class="panel tally">${rows.map(([k,n]) => `
    <div class="trow ${winners.includes(k) ? "win" : ""}">
      <span class="who">${esc(label(k))}</span><span class="n">${n} vote${n>1 ? "s" : ""}</span>
      <span class="tb"><i style="width:${Math.round(n/max*100)}%"></i></span>
    </div>`).join("")}</div>`;
}

function next(){
  const g = S.game;
  g.revealed = null; g.picked = new Set(); g.counts = {};
  if(g.i >= g.deck.length-1){ S.screen="end"; } else { g.i++; }
  render();
}

function countdown(){
  const ov = document.createElement("div"); ov.className="countdown"; document.body.appendChild(ov);
  const seq = ["3","2","1","Pointez !"]; let k=0;
  const tick = () => {
    if(k>=seq.length){ ov.remove(); return; }
    ov.innerHTML = `<span style="${k===3?'font-size:min(18vw,110px)':''}">${seq[k]}</span>`; k++;
    setTimeout(tick, k===4 ? 1100 : 800);
  };
  ov.onclick = () => ov.remove();
  tick();
}

/* ================= Fin ================= */
function renderEnd(){
  const g = S.game, M = MODES[g.mode];
  const ranked = Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);
  const top = ranked[0][1];
  const winners = ranked.filter(r=>r[1]===top && top>0).map(r=>r[0]);
  const crown = !winners.length ? "Personne n'a marqué. Suspect."
    : g.mode==="sus" ? `${winners.map(esc).join(" et ")} ${winners.length>1?"sont":"est"} officiellement le plus susceptible de tout.`
    : g.mode==="av" ? `${winners.map(esc).join(" et ")} ${winners.length>1?"ont":"a"} relevé le plus de défis.`
    : `${winners.map(esc).join(" et ")} ${winners.length>1?"ont":"a"} le passé le plus chargé du groupe.`;
  let rank = 0, prev = null;
  app.innerHTML = `
    <div class="topbar"><span class="label">${M.name} · ${g.mode==="av" ? g.rounds + " tours" : g.deck.length + " questions"}</span></div>
    <h1 style="font-size:clamp(36px,10vw,56px);font-weight:800;letter-spacing:-.02em">${M.endTitle}</h1>
    <p class="crown">${crown}</p>
    <div class="podium">
      ${ranked.map(([p,s],idx)=>{ if(s!==prev){ rank=idx+1; prev=s; }
        return `<div class="row ${s===top&&top>0?"first":""}"><span class="rk">${rank}</span><span class="nm">${esc(p)}</span><span class="sc">${s} pt${s>1?"s":""}</span></div>`; }).join("")}
    </div>
    <div class="actions">
      <button class="btn accent" id="again">Rejouer</button>
      <button class="btn ghost" id="other">Changer de mode</button>
    </div>

  document.getElementById("again").onclick = () => startGame(g.mode);
  document.getElementById("other").onclick = () => startGame(g.mode==="sus" ? "deja" : g.mode==="deja" ? "av" : "sus");
  const home = document.createElement("button"); home.className="btn ghost"; home.textContent="Modifier les joueurs";
  home.onclick = () => { S.screen="home"; render(); };
  app.querySelector(".actions").appendChild(home);
}

Object.defineProperty(O, "votes",   { get: () => (O.room && O.room.votes) || {} });

function initCaps(){
  if(O.ready) return;
  try{
    const cfg = window.FIREBASE_CONFIG;
    if(window.firebase && cfg && cfg.apiKey && cfg.databaseURL && !/COLLE/i.test(cfg.apiKey)){
      const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
      O.db = app.database();
    }

function errMsg(e){
  const c = String((e && (e.code || e.message)) || "");
  if(/permission/i.test(c)) return "La base de données refuse l'accès. Vérifie les règles dans la console Firebase.";
  return "Problème de connexion. Réessaie dans un instant.";
}
function buildDeck(mode, spicy, rounds){
  const own = (S.custom[mode]||"").split("\n").map(s=>s.trim().replace(/^(qui est le plus susceptible de|qui a déjà)\s*/i,"").replace(/\s*\?$/,"")).filter(Boolean).map(t=>({t, own:true}));
  const deck = shuffle(own.concat(poolFor(mode, spicy)).slice(0, Math.max(rounds, own.length))).slice(0, rounds);
  markSeen(mode, deck);
  return deck;
}
const pids = () => Object.keys(O.players).sort((a,b)=>(O.players[a].joinedAt||0)-(O.players[b].joinedAt||0));
const nameOf = id => (O.players[id] && O.players[id].name) || (O.room && O.room.names && O.room.names[id]) || "Joueur parti";
const namesMap = () => Object.assign({}, (O.room && O.room.names) || {}, Object.fromEntries(pids().map(id=>[id, O.players[id].name])));
const curVotes = () => Object.entries(O.votes).filter(([id,v]) => O.players[id] && v.round===O.room.i && v.game===O.room.game);
const roomRef = () => O.db.ref("rooms/"+O.code);
const saveRoom = patch => roomRef().update(patch);

    <div class="topbar"><button class="btn ghost" id="back">Retour</button><span class="label">Jeu en ligne</span></div>
    <h1 style="font-size:clamp(36px,10vw,56px);font-weight:800;letter-spacing:-.02em">Chacun sur son appareil</h1>
    <p class="hint">Téléphone ou PC : chacun ouvre ce même lien, entre le code de la partie et vote en secret. Aucun compte nécessaire.</p>
    ${!ok ? `
      <div class="panel"><p class="hint">Le jeu en ligne n'est pas encore branché à sa base de données. La personne qui héberge le site doit remplir le fichier config.js (voir le guide). En attendant, tu peux jouer sur un seul appareil.</p></div>` : `
      <section class="panel">
        <label class="label" for="pseudo">Ton prénom</label>
        <input id="pseudo" class="field" maxlength="20" value="${esc(store.get("pseudo",""))}" placeholder="Ex. Léa" autocomplete="off">
      </section>
      ${saved ? `<button class="btn ghost" id="resume">Reprendre la partie ${esc(saved)}</button>` : ""}
      <section class="panel">
        <div class="label">Rejoindre une partie</div>
        <form class="addrow" id="joinForm">
          <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off" aria-label="Code de la partie" style="text-transform:uppercase;letter-spacing:.25em;font-weight:700">
          <button class="btn" type="submit">Rejoindre</button>
        </form>
      </section>
      <button class="btn big" id="create" style="background:var(--sus);color:var(--sus-ink)">Créer une nouvelle partie</button>
    `}
    ${O.err ? `<p class="err">${esc(O.err)}</p>` : ""}
  `;
  document.getElementById("back").onclick = () => { S.screen="home"; render(); };
  if(!ok) return;
  document.getElementById("create").onclick = createRoom;
  document.getElementById("joinForm").addEventListener("submit", e => { e.preventDefault(); joinRoom(document.getElementById("codeInput").value); });
  const r = document.getElementById("resume"); if(r) r.onclick = () => joinRoom(saved);
}
function getPseudo(){
  const v = (document.getElementById("pseudo").value||"").trim();
  if(!v){ O.err = "Entre ton prénom d'abord."; renderOnlineEntry(); return null; }
  store.set("pseudo", v); return v;
}
async function createRoom(){
  const name = getPseudo(); if(!name || O.busy) return;
  O.busy = true; O.err = "";
  try{
    let code = null;
    for(let t=0; t<8 && !code; t++){
      const c = Array.from({length:4}, () => ALPH[Math.floor(Math.random()*ALPH.length)]).join("");
      const res = await O.db.ref("rooms/"+c).transaction(cur => cur === null
        ? { host:O.me, phase:"lobby", mode:"sus", level:"soft", rounds:20, i:0, createdAt:Date.now() }
        : undefined);
      if(res.committed) code = c;
    }
    if(!code) throw new Error("no code");
    await enterRoom(code, name);
  }catch(e){ O.err = errMsg(e); renderOnlineEntry(); }
  O.busy = false;
}
async function joinRoom(raw){
  const code = String(raw||"").trim().toUpperCase();
  if(!/^[A-Z]{4}$/.test(code)){ O.err = "Le code fait 4 lettres."; renderOnlineEntry(); return; }
  const name = getPseudo(); if(!name || O.busy) return;
  O.busy = true; O.err = "";
  try{
    const s = await O.db.ref("rooms/"+code+"/host").once("value");
    if(!s.exists()){ O.err = "Aucune partie avec ce code."; store.set("room", null); renderOnlineEntry(); O.busy=false; return; }
    await enterRoom(code, name);
  }catch(e){ O.err = errMsg(e); renderOnlineEntry(); }
  O.busy = false;
}
async function enterRoom(code, name){
  const ref = O.db.ref(`rooms/${code}/players/${O.me}`);
  const prev = await ref.once("value");
  await ref.set({ name, joinedAt: (prev.exists() && prev.val().joinedAt) || Date.now() });
  O.code = code; store.set("room", code);
  subscribe(code);
  S.screen = "online"; O.key = ""; renderOnline();
}
function unsubAll(){ if(O.off){ O.off(); O.off = null; } clearTimeout(O.timer); }
function subscribe(code){
  unsubAll();
  Object.assign(O, { room:null, loaded:false, stale:false, err:"" });
  O.timer = setTimeout(() => { O.stale = true; if(S.screen==="online") renderOnline(); }, 10000);
  const ref = O.db.ref("rooms/"+code);
  const cb = s => { clearTimeout(O.timer); O.stale = false; O.loaded = true; O.room = s.val(); changed(); };
  const fail = e => { O.err = errMsg(e); if(S.screen==="online") renderOnline(); };
  ref.on("value", cb, fail);
  O.off = () => ref.off("value", cb);
}
function changed(){
  if(S.screen!=="online") return;
  if(O.room){ setAccent(O.room.mode || "sus"); autoReveal(); }
  renderOnline();
}
function autoReveal(){
  const R = O.room;
  if(R.host!==O.me || R.phase!=="vote" || O.revealing) return;
  const n = pids().length;
  if(n>0 && curVotes().length >= n) reveal();
}
async function reveal(){
  const R = O.room;
  if(O.revealing || R.phase!=="vote") return;
  O.revealing = true;
  const votes = curVotes();
  const scores = Object.assign({}, R.scores);
  pids().forEach(id => { if(scores[id]==null) scores[id] = 0; });
  let result;
  if(R.mode==="sus"){
    const tally = {};
    votes.forEach(([, v]) => { if(O.players[v.pick]) tally[v.pick] = (tally[v.pick]||0) + 1; });
    const max = Math.max(0, ...Object.values(tally));
    const winners = max>0 ? Object.keys(tally).filter(k => tally[k]===max) : [];
    winners.forEach(w => scores[w] = (scores[w]||0) + 1);
    result = { tally, winners, voters: votes.length };
  } else {
    const yes = votes.filter(([, v]) => v.yes).map(([id]) => id);
    const no = votes.filter(([, v]) => !v.yes).map(([id]) => id);
    yes.forEach(y => scores[y] = (scores[y]||0) + 1);
    result = { yes, no, none: !yes.length };
  }
  try{ await saveRoom({ phase:"reveal", scores, result, names:namesMap() }); }catch(e){ O.err = errMsg(e); renderOnline(); }
  O.revealing = false;
}
async function hostDo(fn){
  if(O.busy) return; O.busy = true;
  try{ await fn(); }catch(e){ O.err = errMsg(e); renderOnline(); }
  O.busy = false;
}
const startOnline = () => hostDo(() => {
  const R = O.room;
  if(R.mode==="av"){
    const lvl = R.level||"soft", n = R.rounds||20;
    return saveRoom({ phase:"pick", i:0, card:null, result:null, game: Date.now(), votes:null, deck:null,
      order: shuffle(pids()), lists:{ v:poolAV("v", lvl).slice(0, n), a:poolAV("a", lvl).slice(0, n) }, idx:{v:0, a:0},
      scores: Object.fromEntries(pids().map(id => [id, 0])), names: namesMap() });
  }
  return saveRoom({ phase:"vote", deck: buildDeck(R.mode||"sus", R.level||"soft", R.rounds||20), i:0, result:null, game: Date.now(), votes:null,
    scores: Object.fromEntries(pids().map(id => [id, 0])), names: namesMap() });
});
const nextOnline = () => hostDo(() => {
  const R = O.room;
  return R.i >= (R.deck||[]).length-1 ? saveRoom({ phase:"end", result:null }) : saveRoom({ phase:"vote", i:R.i+1, result:null });
});
const restartOnline = () => hostDo(() => saveRoom({ phase:"lobby", deck:null, i:0, scores:null, result:null, votes:null, card:null, order:null, lists:null, idx:null }));

/* ---- Action ou vérité en ligne ---- */
// Le joueur dont c'est le tour, en sautant ceux qui ont quitté la partie.
function avCurrent(R){
  const order = (R.order || []).filter(id => O.players[id]);
  return order.length ? order[R.i % order.length] : null;
}
async function avPick(type){
  if(O.busy) return; O.busy = true;
  try{
    const R = O.room;
    if(R.phase!=="pick") return;
    const idx = Object.assign({v:0, a:0}, R.idx);
    const cur = avCurrent(R);
    const t = fillPlayer(drawAV(R.lists || {}, idx, type), pids().filter(id => id!==cur).map(nameOf));
    await saveRoom({ phase:"card", card:{ type, t }, idx });
  }catch(e){ O.err = errMsg(e); renderOnline(); }
  finally{ O.busy = false; }
}
async function avNext(success){
  if(O.busy) return; O.busy = true;
  try{
    const R = O.room, cur = avCurrent(R);
    const patch = { phase:"pick", card:null };
    if(success && cur) patch["scores/"+cur] = ((R.scores||{})[cur]||0) + 1;
    if(R.i >= (R.rounds||20)-1) patch.phase = "end"; else patch.i = R.i + 1;
    await saveRoom(patch);
  }catch(e){ O.err = errMsg(e); renderOnline(); }
  finally{ O.busy = false; }
}
function renderAVOnline(R, isHost, top, bindLeave, extra){
  const n = R.rounds || 20, cur = avCurrent(R), mine = cur===O.me, curName = cur ? nameOf(cur) : "…";
  const head = `${top(`Tour ${R.i+1} / ${n}`)}<div class="bar" aria-hidden="true"><i style="width:${R.i/n*100}%"></i></div>`;
  const scores = avScoresHtml(pids().map(id => [nameOf(id) + (id===O.me ? " (toi)" : ""), (R.scores||{})[id]||0]));
  let body;
  if(R.phase==="card" && R.card){
    body = `${avCardHtml(R.card, curName, R.level||"soft")}
      ${mine ? `<p class="instr">Relève le défi, puis dis honnêtement si c'est fait.</p>
        <div class="actions"><button class="btn ghost" id="avNo">Refusé</button><button class="btn accent" id="avYes">${R.card.type==="v" ? "J'ai répondu" : "Défi relevé"} · +1</button></div>`
      : `<p class="instr">${esc(curName)} doit ${R.card.type==="v" ? "répondre" : "relever le défi"}.</p>
        ${isHost ? `<div class="actions"><button class="btn ghost" id="avSkip">Passer son tour</button></div>` : ""}`}`;
  } else {
    body = `${avTurnHtml(curName, mine)}
      ${mine ? `<p class="instr">Action ou vérité ?</p>
        <div class="yesno"><button class="pbtn" data-avpick="v">Vérité</button><button class="pbtn" data-avpick="a">Action</button></div>`
      : `<p class="instr">${esc(curName)} choisit : action ou vérité ?</p>`}
      ${isHost && !mine ? `<div class="actions"><button class="btn ghost" id="avSkip">Passer son tour</button></div>` : ""}`;
  }
  app.innerHTML = head + body + scores + extra;
  bindLeave();
  app.querySelectorAll("[data-avpick]").forEach(b => b.onclick = () => avPick(b.dataset.avpick));
  const y = document.getElementById("avYes"); if(y) y.onclick = () => avNext(true);
  const no = document.getElementById("avNo"); if(no) no.onclick = () => avNext(false);
  const sk = document.getElementById("avSkip"); if(sk) sk.onclick = () => avNext(false);
}
async function castVote(payload){
  if(O.busy) return; O.busy = true;
  try{ await O.db.ref(`rooms/${O.code}/votes/${O.me}`).set(Object.assign({ round:O.room.i, game:O.room.game }, payload)); }
  catch(e){ O.err = errMsg(e); }
  O.busy = false; renderOnline();
}
async function leaveRoom(){
  try{
    if(O.room && O.room.host===O.me){
      const other = pids().find(id => id!==O.me);
      if(other) await saveRoom({ host: other });
    }
    await O.db.ref(`rooms/${O.code}/players/${O.me}`).remove();
  }catch(e){}
  unsubAll(); O.code = null; O.room = null; store.set("room", null);
  S.screen = "home"; render();
}

function renderOnline(){
  app.dataset.screen = "online";
  const R = O.room;
  const errHtml = O.err ? `<p class="err">${esc(O.err)}</p>` : "";
  const top = right => `<div class="topbar"><button class="btn ghost" id="leave">Quitter</button><span class="progress">${right}</span></div>`;
  const bindLeave = () => { document.getElementById("leave").onclick = leaveRoom; };

  if(!R){
    app.innerHTML = `${top("Partie "+esc(O.code||""))}
      <p class="instr">${O.loaded ? "Cette partie n'existe plus." : O.stale ? "Impossible de joindre la partie pour l'instant. Vérifie ta connexion." : "Connexion à la partie…"}</p>${errHtml}`;
    bindLeave(); return;
  }
  const isHost = R.host===O.me, ids = pids(), M = MODES[R.mode];
  const key = R.phase + "-" + R.i;
  if(key!==O.key){ O.key = key; window.scrollTo(0,0); }

  if(O.loaded && !O.players[O.me]){
    app.innerHTML = `${top("Partie "+esc(O.code))}
      <div class="panel"><p class="hint">Tu ne fais plus partie de cette partie.</p><button class="btn" id="rejoin">Revenir dans la partie</button></div>${errHtml}`;
    bindLeave();
    document.getElementById("rejoin").onclick = () => enterRoom(O.code, store.get("pseudo","Joueur")).catch(e => { O.err = errMsg(e); renderOnline(); });
    return;
  }
  const stale = O.stale ? `<p class="hint" style="text-align:center">Connexion lente : l'affichage n'est peut-être pas à jour.</p>` : "";

  if(R.phase==="lobby"){
    const dis = isHost ? "" : "disabled";
    app.innerHTML = `
      ${top(isHost ? "Tu es l'hôte" : "Salle d'attente")}
      <section class="panel" style="align-items:center;text-align:center">
        <span class="label">Code de la partie</span>
        <div class="code">${esc(O.code)}</div>
        <p class="hint">Tes amis ouvrent ce même lien, cliquent sur « Jouer en ligne » et entrent ce code.</p>
      </section>
      <section class="panel">
        <div class="label">Joueurs connectés · ${ids.length}</div>
        <div class="plist">
          ${ids.map(id => `<div class="prow"><span>${esc(nameOf(id))}${id===O.me ? '<span class="tagme">toi</span>' : ""}${id===R.host ? '<span class="tagme">hôte</span>' : ""}</span>
            ${isHost && id!==O.me ? `<button class="btn ghost small" data-kick="${esc(id)}">Retirer</button>` : ""}</div>`).join("")}
        </div>
      </section>
      <section class="panel">
        <div class="opts">
          <div class="opt"><span class="label">Mode</span>
            <div class="seg" role="group" aria-label="Mode">
              <button type="button" data-omode="sus" aria-pressed="${R.mode==="sus"}" ${dis}>Plus susceptible</button>
              <button type="button" data-omode="deja" aria-pressed="${R.mode==="deja"}" ${dis}>Qui a déjà</button>
              <button type="button" data-omode="av" aria-pressed="${R.mode==="av"}" ${dis}>Action ou vérité</button>
            </div></div>
          <div class="opt"><span class="label">Questions</span>
            <div class="seg" role="group" aria-label="Nombre de questions">
              ${[10,20,40,80].map(n => `<button type="button" data-orounds="${n}" aria-pressed="${R.rounds===n}" ${dis}>${n}</button>`).join("")}
            </div></div>
          <div class="opt"><span class="label">Ambiance</span>
            <div class="seg" role="group" aria-label="Ambiance">
              ${LEVELS.map(([k,l]) => `<button type="button" data-olevel="${k}" aria-pressed="${(R.level||"soft")===k}" ${dis}>${l}</button>`).join("")}
            </div></div>
        </div>
      </section>
      ${isHost ? `<button class="btn accent big" id="start" ${ids.length<2 ? "disabled" : ""}>Lancer la partie</button>
        ${ids.length<2 ? `<p class="hint" style="text-align:center">Il faut au moins 2 joueurs connectés.</p>` : ""}`
        : `<p class="instr">L'hôte va lancer la partie.</p>`}
      ${stale}${errHtml}`;
    bindLeave();
    if(isHost){
      document.getElementById("start").onclick = startOnline;
      app.querySelectorAll("[data-omode]").forEach(b => b.onclick = () => hostDo(() => saveRoom({ mode:b.dataset.omode })));
      app.querySelectorAll("[data-orounds]").forEach(b => b.onclick = () => hostDo(() => saveRoom({ rounds:+b.dataset.orounds })));
      app.querySelectorAll("[data-olevel]").forEach(b => b.onclick = () => hostDo(() => saveRoom({ level:b.dataset.olevel })));
      app.querySelectorAll("[data-kick]").forEach(b => b.onclick = () => O.db.ref(`rooms/${O.code}/players/${b.dataset.kick}`).remove().catch(e => { O.err = errMsg(e); renderOnline(); }));
    }
    return;
  }

  if(R.phase==="end"){
    const ranked = Object.entries(R.scores||{}).sort((a,b) => b[1]-a[1]);
    const topScore = ranked.length ? ranked[0][1] : 0;
    const winners = ranked.filter(r => r[1]===topScore && topScore>0).map(r => nameOf(r[0]));
    const crown = !winners.length ? "Personne n'a marqué. Suspect."
      : R.mode==="sus" ? `${winners.map(esc).join(" et ")} ${winners.length>1 ? "sont" : "est"} officiellement le plus susceptible de tout.`
      : R.mode==="av" ? `${winners.map(esc).join(" et ")} ${winners.length>1 ? "ont" : "a"} relevé le plus de défis.`
      : `${winners.map(esc).join(" et ")} ${winners.length>1 ? "ont" : "a"} le passé le plus chargé du groupe.`;
    let rank = 0, prev = null;
    app.innerHTML = `
      ${top(M.name + " · " + (R.mode==="av" ? (R.rounds||20) + " tours" : (R.deck||[]).length + " questions"))}
      <h1 style="font-size:clamp(36px,10vw,56px);font-weight:800;letter-spacing:-.02em">${M.endTitle}</h1>
      <p class="crown">${crown}</p>
      <div class="podium">
        ${ranked.map(([id,s], idx) => { if(s!==prev){ rank = idx+1; prev = s; }
          return `<div class="row ${s===topScore && topScore>0 ? "first" : ""}"><span class="rk">${rank}</span><span class="nm">${esc(nameOf(id))}${id===O.me ? " (toi)" : ""}</span><span class="sc">${s} pt${s>1 ? "s" : ""}</span></div>`; }).join("")}
      </div>
      ${isHost ? `<button class="btn accent big" id="again">Nouvelle partie avec la même bande</button>` : `<p class="instr">L'hôte peut relancer une partie.</p>`}
      ${errHtml}`;
    bindLeave();
    if(isHost) document.getElementById("again").onclick = restartOnline;
    return;
  }

  if(R.mode==="av") return renderAVOnline(R, isHost, top, bindLeave, stale + errHtml);

  const card = R.deck[R.i] || { t:"…" };
  const pct = (R.i / R.deck.length) * 100;
  const head = `
    ${top(`Question ${R.i+1} / ${R.deck.length}`)}
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <article class="card" aria-live="polite">
      ${card.lvl ? `<span class="spicy">${card.lvl==="hard" ? "Hard" : "Modéré"}</span>` : card.own ? `<span class="spicy">Question maison</span>` : ""}
      <div class="lead">${M.lead}</div>
      <div class="q">${esc(card.t)} ?</div>
    </article>`;

  if(R.phase==="vote"){
    const votes = curVotes(), mv = O.votes[O.me], mine = mv && mv.round===R.i && mv.game===R.game ? mv : null;
    const votedSet = new Set(votes.map(v => v[0]));
    app.innerHTML = `
      ${head}
      ${R.mode==="sus" ? `
        <p class="instr">${mine ? "Vote enregistré. Tu peux encore changer d'avis." : "Vote en secret : touche le joueur de ton choix."}</p>
        <div class="players">
          ${ids.map(id => `<button class="pbtn" data-vote="${esc(id)}" aria-pressed="${!!(mine && mine.pick===id)}">${esc(nameOf(id))}<small>${id===O.me ? "toi · " : ""}${(R.scores && R.scores[id]) || 0} pt${((R.scores && R.scores[id]) || 0)>1 ? "s" : ""}</small></button>`).join("")}
        </div>` : `
        <p class="instr">${mine ? "Réponse enregistrée. Tu peux encore changer d'avis." : "Réponds en secret. Pas de mensonges."}</p>
        <div class="yesno">
          <button class="pbtn" data-yes="1" aria-pressed="${!!(mine && mine.yes)}">Oui, déjà</button>
          <button class="pbtn" data-yes="0" aria-pressed="${!!(mine && mine.yes===false)}">Jamais</button>
        </div>`}
      <p class="instr"><strong>${votes.length} / ${ids.length}</strong> ont répondu</p>
      <div class="voted">${ids.map(id => `<span class="${votedSet.has(id) ? "ok" : ""}">${esc(nameOf(id))}</span>`).join("")}</div>
      ${isHost ? `<div class="actions"><button class="btn ghost" id="revealNow">Révéler sans attendre</button></div>` : ""}
      ${stale}${errHtml}`;
    bindLeave();
    app.querySelectorAll("[data-vote]").forEach(b => b.onclick = () => castVote({ pick:b.dataset.vote }));
    app.querySelectorAll("[data-yes]").forEach(b => b.onclick = () => castVote({ yes:b.dataset.yes==="1" }));
    const rv = document.getElementById("revealNow"); if(rv) rv.onclick = reveal;
    return;
  }

  // reveal
  const res = R.result || {};
  let body;
  if(R.mode==="sus"){
    const w = res.winners || [];
    body = `
      <div class="result"><div class="big">${w.length ? w.map(id => esc(nameOf(id))).join(", ") : "Personne"}</div>
        <p class="instr">${w.length ? (w.length>1 ? "Égalité ! +1 point chacun." : "a reçu le plus de votes. +1 point.") : "Aucun vote."}</p></div>
      ${tallyHtml(res.tally || {}, w, nameOf)}`;
  } else {
    const yes = res.yes || [], no = res.no || [];
    body = `
      <div class="result"><div class="big">${!yes.length ? "Personne" : yes.length===ids.length && ids.length>1 ? "Tout le monde" : yes.map(id => esc(nameOf(id))).join(", ")}</div>
        <p class="instr">${!yes.length ? "Des anges, ou des menteurs." : yes.length>1 ? "l'ont déjà fait. +1 point chacun." : "l'a déjà fait. +1 point."}</p></div>
      ${no.length ? `<p class="hint" style="text-align:center">Jamais : ${no.map(id => esc(nameOf(id))).join(", ")}</p>` : ""}`;
  }
  const ranked = Object.entries(R.scores||{}).sort((a,b) => b[1]-a[1]);
  const last = R.i >= R.deck.length-1;
  app.innerHTML = `
    ${head}
    ${body}
    <div class="podium">
      ${ranked.map(([id,s]) => `<div class="row"><span class="rk">·</span><span class="nm">${esc(nameOf(id))}${id===O.me ? " (toi)" : ""}</span><span class="sc">${s} pt${s>1 ? "s" : ""}</span></div>`).join("")}
    </div>
    ${isHost ? `<button class="btn accent big" id="nextQ">${last ? "Voir le classement" : "Question suivante"}</button>` : `<p class="instr">L'hôte passe à la suite…</p>`}
    ${stale}${errHtml}`;
  bindLeave();
  if(isHost) document.getElementById("nextQ").onclick = nextOnline;
}

function render(){
  app.dataset.screen = S.screen;
  if(S.screen==="home") renderHome();
  else if(S.screen==="play") renderPlay();
  else if(S.screen==="online-entry") renderOnlineEntry();
  else if(S.screen==="online"){ renderOnline(); return; }
  else renderEnd();
  window.scrollTo(0,0);
}
initCaps();
render();
</script>

</body>
</html>
